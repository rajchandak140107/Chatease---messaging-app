spring:
  application:
    name: backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatease}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${CHATEASE_JWT_SECRET:SF5vQg0ktMnBFlvdRT9e1GJ9MKGyKXVw1TrHQ9nwlFU= }
    expiration-ms: 86400000